server {
    listen 80;
    server_name 43.165.168.45;

    # 图库素材下发等 multipart 上传：默认 1m 会导致一次选 4+ 张图即 413 并返回 HTML
    client_max_body_size 200m;

    root /opt/auto_traces/auto_traces/web-admin;
    index index.html;

    # 邮箱管理 SPA 由 FastAPI 托管，须反代到后端；否则 try_files 会回落到 web-admin/index.html，
    # iframe 内嵌整页控制台并重复打 /api，易触发 SQLite「数据库繁忙」。
    location /mail-admin/ {
        proxy_pass http://127.0.0.1:8000/mail-admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /static/ {
        alias /opt/auto_traces/auto_traces/web-admin/static/;
        access_log off;
        expires 30d;
    }
}
